name: Integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USE_LOCAL_VERSIONS_JSON: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: ./
        with:
          purescript: "0.15.15"
          spago: "1.0.4"
          psa: ""
          purs-tidy: "0.11.1"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check committed bundles and lockfile are reproducible
        run: |
          npm run bundle
          git -c core.fileMode=false diff --exit-code -- dist spago.yaml spago.lock
          sha256sum dist/index.js dist/update.js > "$RUNNER_TEMP/bundles.sha256"
          npm run bundle
          sha256sum -c "$RUNNER_TEMP/bundles.sha256"

  test-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The existing compiler and legacy Spago tarballs target x86-64.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        toolchain: [defaults, latest, pinned, legacy]
        include:
          - toolchain: latest
            spago: "latest"
            psa: "latest"
          - toolchain: pinned
            spago: "1.0.4"
            psa: ""
          - toolchain: legacy
            spago: "0.21.0"
            psa: "0.8.2"
    env:
      USE_LOCAL_VERSIONS_JSON: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Confirm tools are absent before installation
        run: |
          if command -v spago || command -v psa; then
            echo 'Toolchain is already installed; this would hide installation failures.'
            exit 1
          fi
      - name: Install default toolchain
        if: matrix.toolchain == 'defaults'
        uses: ./
      - name: Install explicit toolchain
        if: matrix.toolchain != 'defaults'
        uses: ./
        with:
          purescript: "0.15.15"
          spago: ${{ matrix.spago }}
          psa: ${{ matrix.psa }}
      - name: Assert installed versions and PSA opt-out
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          expected_purs=0.15.15
          expected_spago=1.0.4
          expected_psa=0.9.0
          if [ "$TOOLCHAIN" = defaults ]; then
            expected_purs=$(node -p 'JSON.parse(require("fs").readFileSync("dist/versions-v2.json")).purs.latest')
          fi
          if [ "$TOOLCHAIN" = defaults ] || [ "$TOOLCHAIN" = latest ]; then
            expected_spago=$(node -p 'JSON.parse(require("fs").readFileSync("dist/versions-v2.json")).spago.latest')
            expected_psa=$(node -p 'JSON.parse(require("fs").readFileSync("dist/versions-v2.json")).psa.latest')
          fi
          if [ "$TOOLCHAIN" = legacy ]; then
            expected_spago=0.21.0
            expected_psa=0.8.2
          fi
          test "$(purs --version)" = "$expected_purs"
          test "$(spago --version)" = "$expected_spago"
          if [ "$TOOLCHAIN" = pinned ]; then
            if command -v psa; then
              echo 'PSA was installed despite the empty input.'
              exit 1
            fi
          else
            test "$(psa --version)" = "$expected_psa"
          fi
          echo "EXPECTED_SPAGO=$expected_spago" >> "$GITHUB_ENV"
          echo "EXPECTED_PSA=$expected_psa" >> "$GITHUB_ENV"
      - name: Assert Windows npm command shims
        if: runner.os == 'Windows' && matrix.toolchain != 'legacy'
        shell: pwsh
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if ((spago.cmd --version) -ne $env:EXPECTED_SPAGO) { throw 'Incorrect spago.cmd version' }
          if ($env:TOOLCHAIN -ne 'pinned') {
            if ((psa.cmd --version) -ne $env:EXPECTED_PSA) { throw 'Incorrect psa.cmd version' }
          }
      - name: Build and run a consumer project
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          smoke="$RUNNER_TEMP/setup-purescript-smoke"
          mkdir -p "$smoke/src"
          cp .github/fixtures/Main.purs "$smoke/src/Main.purs"
          if [ "$TOOLCHAIN" = legacy ]; then
            cp .github/fixtures/legacy/spago.dhall "$smoke/spago.dhall"
          else
            cp .github/fixtures/modern/spago.yaml "$smoke/spago.yaml"
          fi
          cd "$smoke"
          spago build
          spago run | tee result.txt
          grep -Fx 'setup-purescript smoke' result.txt
